<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>GrabFleet — Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app-topbar"></div>
<div class="layout">
<div id="app-sidebar"></div>
<main class="main">

<div class="view active" id="view-dashboard">
  <div class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-subtitle">Fleet overview · Southeast Asia</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="last-updated-pill" id="dash-last-updated">🟢 Updated just now</span>
      <button class="btn btn-outline" onclick="window.location.href='mapview.html'">🗺️ Open Map</button>
      <button class="btn btn-primary" onclick="window.location.href='reports.html'">📊 Reports</button>
    </div>
  </div>

  <!-- KPI Stat Tiles -->
  <div class="stat-tiles" id="dash-stat-tiles"></div>

  <!-- 3-Column Grid: Alerts, Utilization, Quick Actions -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px">

    <!-- Recent Alerts -->
    <div class="info-card">
      <div class="info-card-header">
        <span class="info-card-title">🔔 Recent Alerts</span>
        <a class="info-card-link" href="alerts.html">View all →</a>
      </div>
      <div id="dash-alerts"></div>
    </div>

    <!-- Fleet Utilization -->
    <div class="info-card">
      <div class="info-card-header">
        <span class="info-card-title">📈 Fleet Utilization</span>
        <span style="font-size:0.72rem;color:var(--text-secondary)">Today</span>
      </div>
      <div id="dash-utilization"></div>
    </div>

    <!-- Quick Actions -->
    <div class="info-card">
      <div class="info-card-header">
        <span class="info-card-title">⚡ Quick Actions</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <a href="mapview.html" class="quick-action-btn">🗺️ Real-time Map View</a>
        <a href="vehicles.html" class="quick-action-btn">🚗 Manage Vehicles</a>
        <a href="alerts.html" class="quick-action-btn">🔔 View All Alerts</a>
        <a href="fleets.html" class="quick-action-btn">🏢 Fleet & Geofences</a>
        <a href="reports.html" class="quick-action-btn">📊 Generate Report</a>
      </div>
    </div>
  </div>

  <!-- 2-Column Grid: Events & DAX -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

    <!-- Recent Events -->
    <div class="info-card">
      <div class="info-card-header">
        <span class="info-card-title">⚡ Recent Events</span>
        <a class="info-card-link" href="telematics.html">View all →</a>
      </div>
      <div class="recent-events" id="dash-events"></div>
    </div>

    <!-- DAX Summary -->
    <div class="info-card">
      <div class="info-card-header">
        <span class="info-card-title">🏅 Driver Performance</span>
        <a class="info-card-link" href="dax.html">View all →</a>
      </div>
      <div id="dash-dax"></div>
    </div>
  </div>
</div>

</main>
</div>

<style>
.quick-action-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg);
  border-radius: 10px;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.quick-action-btn:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}
.alert-mini-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.alert-mini-item:last-child { border-bottom: none; }
.alert-mini-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.alert-mini-icon.critical { background: #FEE2E2; }
.alert-mini-icon.warning { background: #FEF3C7; }
.alert-mini-icon.info { background: #DBEAFE; }
.util-metric {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.util-metric:last-child { border-bottom: none; }
.util-label { font-size: 0.85rem; color: var(--text-secondary); }
.util-value { font-size: 1.1rem; font-weight: 700; }
.util-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.util-bar-fill { height: 100%; border-radius: 3px; background: var(--primary); }
</style>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
const currentUser = checkAuth();
injectLayout('dashboard.html');

function getDaxTier(score) {
  if (score >= 90) return 'excellent';
  if (score >= 75) return 'good';
  if (score >= 55) return 'fair';
  return 'risk';
}

function renderDashboard() {
  const s = fleetStats;
  const actPct = Math.round(s.online / s.total * 100);

  const drivers = daxDrivers.map(d => ({ ...d, tier: getDaxTier(d.daxScore) }));
  const dAvg = Math.round(drivers.reduce((a,d) => a + d.daxScore, 0) / drivers.length);
  const dExcellent = drivers.filter(d => d.tier === 'excellent').length;
  const dGood = drivers.filter(d => d.tier === 'good').length;
  const dFair = drivers.filter(d => d.tier === 'fair').length;
  const dAtRisk = drivers.filter(d => d.tier === 'risk').length;

  const pd = paymentData;
  const payGross = pd.reduce((a,p) => a + p.gross, 0);
  const payDisbursed = pd.filter(p=>p.status==='completed').reduce((a,p)=>a+(p.gross-p.deductions),0);
  const payPending = pd.filter(p=>p.status==='pending'||p.status==='processing').reduce((a,p)=>a+(p.gross-p.deductions),0);
  const payFailed = pd.filter(p=>p.status==='failed').length;
  const payFmt = v => '$' + v.toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});

  // KPI Tiles
  const tilesEl = document.getElementById('dash-stat-tiles');
  if (tilesEl) tilesEl.innerHTML = `
    <div class="stat-tile" onclick="window.location.href='vehicles.html'">
      <div class="stat-tile-icon" style="background:var(--grab-light-green)">🚗</div>
      <div class="stat-tile-body">
        <div class="stat-tile-label">Total Fleet</div>
        <div class="stat-tile-main">${fn(s.total)}</div>
        <div class="stat-tile-subs">
          <div class="stat-tile-sub"><b>⛽ ${fn(s.ice)}</b> ICE · <b>⚡ ${fn(s.ev)}</b> EV · <b>🔋 ${fn(s.hybrid)}</b> Hybrid</div>
        </div>
      </div>
    </div>
    <div class="stat-tile" onclick="window.location.href='mapview.html'">
      <div class="stat-tile-icon" style="background:#DBEAFE">📡</div>
      <div class="stat-tile-body">
        <div class="stat-tile-label">Online Now</div>
        <div class="stat-tile-main" style="color:#10B981">${fn(s.online)}</div>
        <div class="stat-tile-subs">
          <div class="stat-tile-sub ok"><b>🟢 ${actPct}%</b> active · <b>🟡 ${fn(s.idle)}</b> idle · <b>🔴 ${fn(s.offline)}</b> offline</div>
        </div>
      </div>
    </div>
    <div class="stat-tile" onclick="window.location.href='dax.html'">
      <div class="stat-tile-icon" style="background:#FEF3C7">🏅</div>
      <div class="stat-tile-body">
        <div class="stat-tile-label">Avg DAX Score</div>
        <div class="stat-tile-main">${dAvg}</div>
        <div class="stat-tile-subs">
          <div class="stat-tile-sub"><b>🏆 ${dExcellent}</b> excellent · <b>👍 ${dGood}</b> good · <b>⚠️ ${dFair + dAtRisk}</b> need attention</div>
        </div>
      </div>
    </div>
    <div class="stat-tile" onclick="window.location.href='payments.html'">
      <div class="stat-tile-icon" style="background:#DCFCE7">💳</div>
      <div class="stat-tile-body">
        <div class="stat-tile-label">Payments MTD</div>
        <div class="stat-tile-main">${payFmt(payGross)}</div>
        <div class="stat-tile-subs">
          <div class="stat-tile-sub"><b>✅ ${payFmt(payDisbursed)}</b> paid · <b>⏳ ${payFmt(payPending)}</b> pending</div>
        </div>
      </div>
    </div>`;

  // Recent Alerts
  const alertsEl = document.getElementById('dash-alerts');
  const alerts = [
    { icon: '🚨', type: 'critical', title: 'Collision Detected', vehicle: 'SGX1234A', time: '5 min ago' },
    { icon: '⚠️', type: 'warning', title: 'Harsh Braking', vehicle: 'WKL7823B', time: '12 min ago' },
    { icon: '🏁', type: 'info', title: 'Geofence Exit', vehicle: 'BJB3921C', time: '18 min ago' },
    { icon: '⚠️', type: 'warning', title: 'Speeding Alert', vehicle: 'BKK4421D', time: '25 min ago' },
  ];
  if (alertsEl) alertsEl.innerHTML = alerts.map(a => `
    <div class="alert-mini-item">
      <div class="alert-mini-icon ${a.type}">${a.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:0.85rem;font-weight:600">${a.title}</div>
        <div style="font-size:0.72rem;color:var(--text-secondary)">${a.vehicle} · ${a.time}</div>
      </div>
    </div>
  `).join('');

  // Fleet Utilization
  const utilEl = document.getElementById('dash-utilization');
  const onlinePct = Math.round(s.online / s.total * 100);
  const tripsPct = 78; // mock
  const avgHours = 6.4; // mock
  if (utilEl) utilEl.innerHTML = `
    <div class="util-metric">
      <div>
        <div class="util-label">Online Rate</div>
        <div class="util-bar" style="width:120px"><div class="util-bar-fill" style="width:${onlinePct}%"></div></div>
      </div>
      <div class="util-value">${onlinePct}%</div>
    </div>
    <div class="util-metric">
      <div>
        <div class="util-label">Trip Completion</div>
        <div class="util-bar" style="width:120px"><div class="util-bar-fill" style="width:${tripsPct}%"></div></div>
      </div>
      <div class="util-value">${tripsPct}%</div>
    </div>
    <div class="util-metric">
      <div class="util-label">Avg Online Hours</div>
      <div class="util-value">${avgHours}h</div>
    </div>
    <div class="util-metric">
      <div class="util-label">Total Distance Today</div>
      <div class="util-value">124,560 km</div>
    </div>
  `;

  // Recent Events
  const eventsEl = document.getElementById('dash-events');
  const events = [
    { dot:'red', text:'<strong>Harsh Braking</strong> — SGX1234A on PIE', time:'2 min ago' },
    { dot:'yellow', text:'<strong>Speeding</strong> — WKL7823B exceeded 90 km/h', time:'8 min ago' },
    { dot:'blue', text:'<strong>Geofence Exit</strong> — BJB3921C left Zone A', time:'15 min ago' },
    { dot:'green', text:'<strong>Trip Completed</strong> — BKK4421D arrived depot', time:'22 min ago' },
    { dot:'purple', text:'<strong>Charging Started</strong> — SGX5512F plugged in', time:'42 min ago' },
  ];
  if (eventsEl) eventsEl.innerHTML = events.map(e => `
    <div class="event-item"><div class="event-dot ${e.dot}"></div><div><div class="event-text">${e.text}</div><div class="event-time">${e.time}</div></div></div>
  `).join('');

  // DAX Summary
  const daxEl = document.getElementById('dash-dax');
  const total = drivers.length;
  const pct = n => Math.round(n/total*100);
  const sorted = [...drivers].sort((a,b) => b.daxScore - a.daxScore);
  if (daxEl) daxEl.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <div style="font-size:0.78rem;color:var(--text-secondary)">Score Distribution</div>
      <div style="font-size:1.5rem;font-weight:700">${dAvg} <span style="font-size:0.72rem;color:#10B981">▲+2.1</span></div>
    </div>
    <div class="dax-dist-track" style="margin-bottom:8px">
      <div class="dax-dist-seg" style="width:${pct(dExcellent)}%;background:#10B981"></div>
      <div class="dax-dist-seg" style="width:${pct(dGood)}%;background:#3B82F6"></div>
      <div class="dax-dist-seg" style="width:${pct(dFair)}%;background:#F97316"></div>
      <div class="dax-dist-seg" style="width:${pct(dAtRisk)}%;background:#EF4444"></div>
    </div>
    <div class="dax-dist-legend" style="margin-bottom:14px">
      <div class="dax-dist-item"><div class="dax-dist-dot" style="background:#10B981"></div>Excellent ${dExcellent}</div>
      <div class="dax-dist-item"><div class="dax-dist-dot" style="background:#3B82F6"></div>Good ${dGood}</div>
      <div class="dax-dist-item"><div class="dax-dist-dot" style="background:#F97316"></div>Fair ${dFair}</div>
      <div class="dax-dist-item"><div class="dax-dist-dot" style="background:#EF4444"></div>At-Risk ${dAtRisk}</div>
    </div>
    <div style="font-size:0.72rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:8px">Top Performers</div>
    ${sorted.slice(0,4).map((d,i) => `
      <div class="dax-mini-row">
        <div style="font-size:0.75rem;font-weight:700;color:var(--text-secondary);width:18px">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:0.82rem;font-weight:500">${d.name}</div>
          <div style="font-size:0.7rem;color:var(--text-secondary)">${d.flag} ${d.city}</div>
        </div>
        <div class="dax-mini-score ${d.tier}">${d.daxScore}</div>
      </div>
    `).join('')}
  `;
}

renderDashboard();

// Update timestamp
(function updateLastUpdated() {
  const el = document.getElementById('dash-last-updated');
  if (!el) return;
  el.textContent = '🟢 Updated ' + new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
  setTimeout(updateLastUpdated, 60000);
})();
</script>
</body>
</html>
