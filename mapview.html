<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>GrabFleet — Map View</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.map-container { position: relative; height: calc(100vh - var(--topbar-height) - 56px); }
#realtime-map { height: 100%; width: 100%; }
.map-overlay-panel { position: absolute; top: 16px; left: 16px; z-index: 500; display: flex; flex-direction: column; gap: 12px; }
.map-stats-bar { display: flex; gap: 8px; }
.map-stat-chip { background: white; border-radius: 10px; padding: 10px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; }
.map-stat-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.map-stat-chip .dot.moving { background: #00B14F; }
.map-stat-chip .dot.idle { background: #F97316; }
.map-stat-chip .dot.offline { background: #EF4444; }
.map-stat-chip .count { font-size: 1.1rem; font-weight: 700; }
.map-filter-card { background: white; border-radius: 12px; padding: 14px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); width: 320px; }
.map-filter-title { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.map-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.map-filter-row:last-child { margin-bottom: 0; }
.map-chip { padding: 5px 12px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 0.78rem; font-weight: 500; cursor: pointer; background: white; transition: all 0.15s; }
.map-chip:hover { border-color: var(--primary); color: var(--primary); }
.map-chip.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.map-search { width: 100%; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.85rem; outline: none; }
.map-search:focus { border-color: var(--primary); }
.vehicle-detail-panel { position: absolute; top: 16px; right: 16px; z-index: 500; background: white; border-radius: 14px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: none; }
.vehicle-detail-panel.open { display: block; }
.vdp-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.vdp-close { margin-left: auto; cursor: pointer; font-size: 1.2rem; color: var(--text-secondary); }
.vdp-plate { font-size: 1.1rem; font-weight: 700; }
.vdp-model { font-size: 0.78rem; color: var(--text-secondary); }
.vdp-body { padding: 16px; }
.vdp-status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.vdp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vdp-item { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.vdp-item-label { font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
.vdp-item-value { font-size: 0.9rem; font-weight: 600; }
.vdp-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.vdp-actions .btn { flex: 1; font-size: 0.8rem; padding: 8px 12px; justify-content: center; }
</style>
</head>
<body>
<div id="app-topbar"></div>
<div class="layout">
<div id="app-sidebar"></div>
<main class="main" style="padding:0;overflow:hidden;">

<div class="map-container">
  <div id="realtime-map"></div>

  <!-- Left overlay: stats + filters -->
  <div class="map-overlay-panel">
    <div class="map-stats-bar">
      <div class="map-stat-chip"><span class="dot moving"></span><span>Moving</span><span class="count" id="count-moving">0</span></div>
      <div class="map-stat-chip"><span class="dot idle"></span><span>Idle</span><span class="count" id="count-idle">0</span></div>
      <div class="map-stat-chip"><span class="dot offline"></span><span>Offline</span><span class="count" id="count-offline">0</span></div>
    </div>
    <div class="map-filter-card">
      <div class="map-filter-title">Search</div>
      <input type="text" class="map-search" id="map-search" placeholder="Plate no., device ID..." />
      <div class="map-filter-title" style="margin-top:12px">Status</div>
      <div class="map-filter-row">
        <span class="map-chip active" data-filter="all">All</span>
        <span class="map-chip" data-filter="moving">Moving</span>
        <span class="map-chip" data-filter="idle">Idle</span>
        <span class="map-chip" data-filter="offline">Offline</span>
      </div>
      <div class="map-filter-title">Fleet</div>
      <div class="map-filter-row" id="fleet-filter-chips"></div>
      <div class="map-filter-title">Vehicle Type</div>
      <div class="map-filter-row">
        <span class="map-chip active" data-vtype="all">All</span>
        <span class="map-chip" data-vtype="Petrol">Petrol</span>
        <span class="map-chip" data-vtype="EV">EV</span>
        <span class="map-chip" data-vtype="Hybrid">Hybrid</span>
      </div>
    </div>
  </div>

  <!-- Right panel: vehicle detail -->
  <div class="vehicle-detail-panel" id="vehicle-detail-panel">
    <div class="vdp-header">
      <div>
        <div class="vdp-plate" id="vdp-plate">SGX1234A</div>
        <div class="vdp-model" id="vdp-model">Toyota Prius · Hybrid</div>
      </div>
      <span class="vdp-close" onclick="closeVehiclePanel()">&times;</span>
    </div>
    <div class="vdp-body">
      <div class="vdp-status-row">
        <span class="status-badge online" id="vdp-status">Online</span>
        <span class="type-badge hybrid" id="vdp-type">Hybrid</span>
        <span style="margin-left:auto;font-size:0.75rem;color:var(--text-secondary)" id="vdp-updated">Updated 10s ago</span>
      </div>
      <div class="vdp-grid">
        <div class="vdp-item">
          <div class="vdp-item-label">Speed</div>
          <div class="vdp-item-value" id="vdp-speed">42 km/h</div>
        </div>
        <div class="vdp-item">
          <div class="vdp-item-label">Location</div>
          <div class="vdp-item-value" id="vdp-location">Orchard Rd</div>
        </div>
        <div class="vdp-item">
          <div class="vdp-item-label">Mileage</div>
          <div class="vdp-item-value" id="vdp-mileage">45,230 km</div>
        </div>
        <div class="vdp-item">
          <div class="vdp-item-label">Battery / Fuel</div>
          <div class="vdp-item-value" id="vdp-fuel">78%</div>
        </div>
        <div class="vdp-item">
          <div class="vdp-item-label">Immobilization</div>
          <div class="vdp-item-value" id="vdp-immob">Unlocked</div>
        </div>
        <div class="vdp-item">
          <div class="vdp-item-label">Device</div>
          <div class="vdp-item-value" id="vdp-device">KDC-001234</div>
        </div>
      </div>
      <div class="vdp-actions">
        <button class="btn btn-outline" onclick="showToast('Opening trip history...','#3B82F6')">📍 Trip</button>
        <button class="btn btn-outline" onclick="showToast('Opening video...','#3B82F6')">📹 Video</button>
        <button class="btn btn-primary" onclick="showToast('Immobilization panel...','#00B14F')">🔒 Control</button>
      </div>
    </div>
  </div>
</div>

</main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
const currentUser = checkAuth();
injectLayout('mapview.html');

let map;
let markers = [];
let selectedVehicle = null;

// Extended vehicle data for map view
const mapVehicles = vehicles.map((v, i) => ({
  ...v,
  speed: v.status === 'Online' ? Math.floor(Math.random() * 60) + 10 : 0,
  mileage: Math.floor(Math.random() * 80000) + 10000,
  fuel: Math.floor(Math.random() * 60) + 40,
  device: 'KDC-' + String(100000 + i).slice(1),
  fleet: ['Singapore Central', 'Singapore East', 'Singapore West', 'Johor Bahru'][i % 4],
  immob: Math.random() > 0.9 ? 'Locked' : 'Unlocked',
  updated: Math.floor(Math.random() * 300)
}));

function initMap() {
  map = L.map('realtime-map', { zoomControl: true }).setView([1.3521, 103.8198], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(map);

  renderMarkers();
  updateCounts();
  renderFleetFilters();
}

function renderMarkers(filter = 'all', fleetFilter = 'all', vtypeFilter = 'all', search = '') {
  // Clear existing
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  mapVehicles.forEach(v => {
    // Apply filters
    const statusMatch = filter === 'all' ||
      (filter === 'moving' && v.status === 'Online' && v.speed > 0) ||
      (filter === 'idle' && v.status === 'Idle') ||
      (filter === 'offline' && v.status === 'Offline');
    const fleetMatch = fleetFilter === 'all' || v.fleet === fleetFilter;
    const vtypeMatch = vtypeFilter === 'all' || v.type === vtypeFilter;
    const searchMatch = !search || v.plate.toLowerCase().includes(search.toLowerCase()) || v.device.toLowerCase().includes(search.toLowerCase());

    if (!statusMatch || !fleetMatch || !vtypeMatch || !searchMatch) return;

    const color = v.status === 'Online' ? '#00B14F' : v.status === 'Idle' ? '#F97316' : '#EF4444';
    const icon = L.divIcon({
      className: 'vmarker ' + v.status.toLowerCase(),
      html: `<div style="background:${color};color:white;padding:4px 8px;border-radius:6px;font-size:0.7rem;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2)">${v.plate}</div>`,
      iconSize: [80, 24],
      iconAnchor: [40, 12]
    });

    const marker = L.marker([v.lat, v.lng], { icon }).addTo(map);
    marker.on('click', () => openVehiclePanel(v));
    markers.push(marker);
  });
}

function updateCounts() {
  const moving = mapVehicles.filter(v => v.status === 'Online' && v.speed > 0).length;
  const idle = mapVehicles.filter(v => v.status === 'Idle' || (v.status === 'Online' && v.speed === 0)).length;
  const offline = mapVehicles.filter(v => v.status === 'Offline').length;

  document.getElementById('count-moving').textContent = moving;
  document.getElementById('count-idle').textContent = idle;
  document.getElementById('count-offline').textContent = offline;
}

function renderFleetFilters() {
  const fleets = [...new Set(mapVehicles.map(v => v.fleet))];
  const container = document.getElementById('fleet-filter-chips');
  container.innerHTML = '<span class="map-chip active" data-fleet="all">All</span>' +
    fleets.map(f => `<span class="map-chip" data-fleet="${f}">${f}</span>`).join('');
}

function openVehiclePanel(v) {
  selectedVehicle = v;
  document.getElementById('vdp-plate').textContent = v.plate;
  document.getElementById('vdp-model').textContent = v.model + ' · ' + v.type;
  document.getElementById('vdp-speed').textContent = v.speed + ' km/h';
  document.getElementById('vdp-location').textContent = v.city;
  document.getElementById('vdp-mileage').textContent = v.mileage.toLocaleString() + ' km';
  document.getElementById('vdp-fuel').textContent = v.fuel + '%';
  document.getElementById('vdp-device').textContent = v.device;
  document.getElementById('vdp-immob').textContent = v.immob;
  document.getElementById('vdp-updated').textContent = 'Updated ' + v.updated + 's ago';

  const statusEl = document.getElementById('vdp-status');
  statusEl.className = 'status-badge ' + v.status.toLowerCase();
  statusEl.textContent = v.status;

  const typeEl = document.getElementById('vdp-type');
  typeEl.className = 'type-badge ' + v.type.toLowerCase();
  typeEl.textContent = v.type;

  document.getElementById('vehicle-detail-panel').classList.add('open');
  map.setView([v.lat, v.lng], 14);
}

function closeVehiclePanel() {
  document.getElementById('vehicle-detail-panel').classList.remove('open');
  selectedVehicle = null;
}

// Filter chip click handlers
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('map-chip')) {
    const parent = e.target.parentElement;
    parent.querySelectorAll('.map-chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    applyFilters();
  }
});

document.getElementById('map-search').addEventListener('input', applyFilters);

function applyFilters() {
  const statusFilter = document.querySelector('[data-filter].active')?.dataset.filter || 'all';
  const fleetFilter = document.querySelector('[data-fleet].active')?.dataset.fleet || 'all';
  const vtypeFilter = document.querySelector('[data-vtype].active')?.dataset.vtype || 'all';
  const search = document.getElementById('map-search').value;
  renderMarkers(statusFilter, fleetFilter, vtypeFilter, search);
}

// Auto-refresh every 10s
setInterval(() => {
  mapVehicles.forEach(v => {
    if (v.status === 'Online') {
      v.lat += (Math.random() - 0.5) * 0.001;
      v.lng += (Math.random() - 0.5) * 0.001;
      v.speed = Math.floor(Math.random() * 60) + 10;
    }
    v.updated = Math.floor(Math.random() * 30);
  });
  applyFilters();
  if (selectedVehicle) openVehiclePanel(selectedVehicle);
}, 10000);

initMap();
</script>
</body>
</html>
